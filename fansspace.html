<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrindZone - FansSpace</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --primary: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo img {
      height: 38px;
    }

    .logo span {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 40px 20px;
      margin-top: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-block;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.3);
      color: var(--primary);
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .back-btn:hover {
      background: rgba(56,189,248,0.2);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 40px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo">
      <img src="https://i.ibb.co/ZRv738N7/grindzone-logo.png" alt="GrindZone Logo">
      <span>GrindZone</span>
    </div>

    <div class="card">
      <span class="icon">👥</span>
      <h1>FANSSPACE</h1>
      <p>Feature coming soon! We are building a dedicated zone for the community to connect, share moments, and vibe.</p>
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div class="footer-note">
      it's just passion
    </div>

  </div>

</body>
</html>
